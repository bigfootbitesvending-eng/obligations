<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obligations — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F4F1;
    --ink: #1C2321;
    --ink-soft: #52605B;
    --rule: #D7D9D3;
    --ledger-green: #2F6F5E;
    --ledger-green-soft: #E4EEEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }
  header {
    margin-bottom: 2rem;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1rem;
  }
  h1 {
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 0.25rem;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--ink-soft); font-size: 0.9rem; }
  .back-link {
    display: inline-block;
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--ledger-green); text-decoration: underline; }
  .back-link:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  h2.category-title {
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin: 0 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--rule);
  }
  .tools { display: flex; flex-direction: column; gap: 0.9rem; }
  a.tool-card {
    display: block;
    background: #fff;
    border: 1px solid var(--rule);
    border-left: 4px solid var(--ledger-green);
    border-radius: 6px;
    padding: 1.1rem 1.25rem;
    text-decoration: none;
    color: var(--ink);
    transition: background 0.15s ease;
  }
  a.tool-card:hover { background: var(--ledger-green-soft); }
  a.tool-card:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  .tool-name {
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 0.3rem;
  }
  .tool-desc { font-size: 0.88rem; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <a class="back-link" href="/">&larr; Operator Tools</a>
  <header>
    <h1>Obligations</h1>
    <div class="subtitle">What gets set aside each week</div>
  </header>

  <div class="tools">
    <a class="tool-card" href="tax/">
      <div class="tool-name">Tax Obligations</div>
      <div class="tool-desc">State, county, and city tax rates behind the weekly set-aside reminder and monthly tax filing prep.</div>
    </a>
    <a class="tool-card" href="non-tax/">
      <div class="tool-name">Non-Tax Obligations</div>
      <div class="tool-desc">Fees, revenue share, financed machines, and annual bills: fixed or percent-of-sales, by location.</div>
    </a>
  </div>
</main>
</body>
</html>
