<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obligations — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/components.css">
<link rel="stylesheet" href="/shared/ledger.css">
<style>

  
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }

  

  
  h2.category-title {
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin: 0 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--rule);
  }
  
  a.tool-card {
    display: block;
    background: #fff;
    border: 1px solid var(--rule);
    border-left: 4px solid var(--ledger-green);
    border-radius: 6px;
    padding: 1.1rem 1.25rem;
    text-decoration: none;
    color: var(--ink);
    transition: background 0.15s ease;
  }
  
  a.tool-card:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <a class="back-link" href="/">&larr; Operator Tools</a>
  <header>
    <h1>Obligations</h1>
    <div class="subtitle">What gets set aside each week</div>
  </header>

  <div class="tools">
    <a class="tool-card" href="tax/">
      <div class="tool-name">Tax Obligations</div>
      <div class="tool-desc">State, county, and city tax rates behind the weekly set-aside reminder and monthly tax filing prep.</div>
    </a>
    <a class="tool-card" href="non-tax/">
      <div class="tool-name">Non-Tax Obligations</div>
      <div class="tool-desc">Fees, revenue share, financed machines, and annual bills: fixed or percent-of-sales, by location.</div>
    </a>
  </div>
</main>
</body>
</html>
