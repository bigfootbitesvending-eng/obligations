<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Non-Tax Obligations — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F4F1;
    --ink: #1C2321;
    --ink-soft: #52605B;
    --rule: #D7D9D3;
    --ledger-green: #2F6F5E;
    --ledger-green-soft: #E4EEEA;
    --danger: #B3492D;
    --danger-soft: #F5E4DE;
    --inactive: #9A8F7D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }

  header {
    margin-bottom: 2rem;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1rem;
  }

  h1 {
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 0.25rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--ledger-green); text-decoration: underline; }
  .back-link:focus-visible {
    outline: 2px solid var(--ledger-green);
    outline-offset: 2px;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 1.5rem;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }

  .panel-header h2 {
    font-family: 'Roboto Slab', serif;
    font-size: 1rem;
    margin: 0;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    border-radius: 4px;
    border: 1px solid transparent;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:focus-visible {
    outline: 2px solid var(--ledger-green);
    outline-offset: 2px;
  }

  .btn-primary { background: var(--ledger-green); color: #fff; }
  .btn-quiet { background: transparent; color: var(--ink-soft); border-color: var(--rule); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-soft); }
  .btn-danger:hover { background: var(--danger-soft); }

  #obl-form {
    display: none;
    padding: 1.1rem;
    gap: 0.75rem;
    grid-template-columns: repeat(6, 1fr);
    align-items: end;
    border-bottom: 1px solid var(--rule);
    background: var(--ledger-green-soft);
  }
  #obl-form.open { display: grid; }
  #obl-form .span2 { grid-column: span 2; }
  #obl-form .span3 { grid-column: span 3; }
  #obl-form .span6 { grid-column: span 6; }
  #obl-form .hidden { display: none; }
  #form-title { grid-column: span 6; font-family: 'Roboto Slab', serif; font-size: 0.95rem; margin: 0; }
  .field-hint { font-size: 0.72rem; color: var(--ink-soft); margin-top: 0.25rem; }
  .form-actions { grid-column: span 6; display: flex; gap: 0.5rem; }

  label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 0.3rem;
  }

  input, select {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    padding: 0.5rem 0.55rem;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: 2px solid var(--ledger-green);
    outline-offset: 1px;
  }

  .num-input { font-family: 'IBM Plex Mono', monospace; text-align: right; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding-bottom: 0.55rem;
  }
  .checkbox-row input { width: auto; }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--rule);
  }
  thead th.num { text-align: right; }

  tbody td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.92rem;
    vertical-align: middle;
  }

  tbody tr.location-start td { border-top: 2px solid var(--ink); }
  tbody tr.inactive-row td { color: var(--inactive); }

  td.item .title { font-weight: 600; }
  td.item .sub { display: block; font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.15rem; }
  td.terms { font-size: 0.85rem; color: var(--ink-soft); }

  td.amount {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  td.active-cell { text-align: center; }
  .pill {
    display: inline-block;
    font-size: 0.72rem;
    padding: 0.15rem 0.5rem;
    border-radius: 20px;
  }
  .pill.on { background: var(--ledger-green-soft); color: var(--ledger-green); }
  .pill.off { background: #F0EEE9; color: var(--inactive); }

  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { margin-left: 0.4rem; }

  tr.editing td { background: var(--ledger-green-soft); }

  tr.location-subtotal td {
    background: var(--ledger-green-soft);
    color: var(--ledger-green);
    font-weight: 600;
    border-bottom: 2px solid var(--ink);
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
  }

  .grand-total {
    display: none;
    justify-content: space-between;
    padding: 0.9rem 1.1rem;
    font-weight: 600;
  }
  .grand-total .amt { font-family: 'IBM Plex Mono', monospace; }
  .grand-total-note { padding: 0 1.1rem 1rem; font-size: 0.78rem; color: var(--ink-soft); }

  .empty-state {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state strong { display: block; color: var(--ink); margin-bottom: 0.35rem; font-family: 'Roboto Slab', serif; }

  #status-line {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-top: 0.75rem;
    min-height: 1.2em;
  }
  #status-line.error { color: var(--danger); }

  @media (max-width: 720px) {
    #obl-form.open { grid-template-columns: 1fr 1fr; }
    #obl-form .span2, #obl-form .span3 { grid-column: span 1; }
    #obl-form .span6, #form-title, .form-actions { grid-column: span 2; }
    thead { display: none; }
    tbody tr { display: block; border-bottom: 2px solid var(--rule); }
    tbody td { display: flex; justify-content: space-between; gap: 1rem; border-bottom: none; padding: 0.5rem 1rem; }
    tbody td::before { content: attr(data-label); font-size: 0.72rem; text-transform: uppercase; color: var(--ink-soft); flex: none; }
    tbody td:empty { display: none; }
    tbody tr.location-start td { border-top: none; }
    tbody tr.location-start { border-top: 2px solid var(--ink); }
    tr.location-subtotal { display: flex; justify-content: space-between; border-bottom: 2px solid var(--ink); }
    tr.location-subtotal td { border-bottom: none; }
    tr.location-subtotal td.amount::before { content: none; }
    tr.location-subtotal td[colspan] { justify-content: space-between; }
    td.item, td.terms { text-align: right; }
    td.actions { justify-content: flex-end; flex-wrap: wrap; }
    td.actions::before { content: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <a class="back-link" href="/">&larr; Operator Tools</a>
  <header>
    <h1>Non-Tax Obligations</h1>
    <div class="subtitle">Set-asides for fees, revenue share, financed machines and annual bills. Everything here feeds the Saturday set-aside
